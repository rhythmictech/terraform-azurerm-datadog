---
name: push
on:
  push:
    branches:
      - main
      - master
      - prod
      - develop

permissions:
  contents: read
  checks: write
  security-events: write

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      - name: Install prerequisites
        run: ./bin/install-ubuntu.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: initialize Terraform
        run: terraform init --backend=false
      - name: Install pre-commit
        run: pip install pre-commit
      - name: pre-commit
        # Run pre-commit directly rather than via pre-commit/action, whose
        # nested actions/cache@v4 is rejected by the org SHA-pin ruleset.
        run: pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: >-
            no-commit-to-branch,
            terraform_tflint_nocreds

  terraform-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      - name: Install prerequisites
        run: ./bin/install-ubuntu.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Each submodule is tested as its own step so failures are individually
      # diagnosable. The pure-azurerm suites and the root suite run first; the
      # log-forwarder step (which downloads the pinned Datadog child module at
      # init) runs last so a registry blip cannot mask the other suites.
      - name: terraform test (modules/diagnostic-setting)
        run: |
          terraform -chdir=modules/diagnostic-setting init --backend=false
          terraform -chdir=modules/diagnostic-setting test
      - name: terraform test (modules/diagnostic-setting-discovery)
        run: |
          terraform -chdir=modules/diagnostic-setting-discovery init --backend=false
          terraform -chdir=modules/diagnostic-setting-discovery test
      - name: terraform test (modules/logs-archive)
        run: |
          terraform -chdir=modules/logs-archive init --backend=false
          terraform -chdir=modules/logs-archive test
      - name: terraform test (modules/activity-log)
        run: |
          terraform -chdir=modules/activity-log init --backend=false
          terraform -chdir=modules/activity-log test
      - name: terraform test (modules/defender-export)
        run: |
          terraform -chdir=modules/defender-export init --backend=false
          terraform -chdir=modules/defender-export test
      # Pre-existing root suite, run separately so its status is never conflated
      # with the submodule tests.
      - name: terraform test (root module)
        run: |
          terraform init --backend=false
          terraform test
      - name: terraform test (modules/log-forwarder)
        run: |
          terraform -chdir=modules/log-forwarder init --backend=false
          terraform -chdir=modules/log-forwarder test

  tflint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Install prerequisites
        run: ./bin/install-ubuntu.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Terraform init
        run: terraform init --backend=false
      - name: tflint
        uses: reviewdog/action-tflint@54a5e5aed57dcfbb4662ec548de876df33d6288d # v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-check
          filter_mode: nofilter
          flags: --call-module-type=all
          level: error
          # The action installs its OWN tflint into a temp path with its own
          # TFLINT_PLUGIN_DIR, so `tflint --init` run by bin/install-ubuntu.sh is
          # invisible to it and .tflint.hcl's azurerm ruleset is not found.
          tflint_init: true
          # Pin to the version bin/install-ubuntu.sh installs. The default is
          # `latest`, which is how the removal of `--module` in tflint 0.54
          # silently broke this job.
          tflint_version: v0.61.0

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      # Informational table-format scan, run FIRST so the log always records which
      # check fired. The SARIF step below is the gate, but on failure it prints
      # nothing (findings go to the output file) and its upload step is skipped,
      # so a failure there leaves no record of the finding anywhere: not in the
      # log, not in the Security tab. exit-code 0 keeps this step purely
      # diagnostic.
      - name: Trivy config scan (table, informational)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_TF_EXCLUDE_DOWNLOADED_MODULES: "true"
        with:
          scan-type: config
          hide-progress: false
          format: table
          exit-code: '0'
          severity: CRITICAL,HIGH
          skip-dirs: '**/.terraform'
      - name: Trivy config scan (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          # Misconfigurations in downloaded third-party modules (e.g. the Datadog
          # forwarder) are out of our control; scan first-party config only, as the
          # pre-commit terraform_trivy hook already does.
          TRIVY_TF_EXCLUDE_DOWNLOADED_MODULES: "true"
        with:
          scan-type: config
          hide-progress: false
          format: sarif
          output: trivy-results.sarif
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          skip-dirs: '**/.terraform'
      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@02c5e83432fe5497fd85b873b6c9f16a8578e1d9 # v3
        with:
          sarif_file: trivy-results.sarif

  misspell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: misspell
        uses: reviewdog/action-misspell@d6429416b12b09b4e2768307d53bef58d172e962 # v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          locale: US
          reporter: github-check
          filter_mode: nofilter
          level: error

  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: yamllint
        uses: reviewdog/action-yamllint@b5f7217d8c815ae374d1d55840d5e569d82f01f0 # v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-check
          filter_mode: nofilter
          level: error
